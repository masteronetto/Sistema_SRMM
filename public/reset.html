<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SRMM | Restablecer contraseña</title>
  <link rel="icon" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--accent:#6d5141;--muted:#7a6c62;--panel:#fff}
    body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#faf6f2 0%,#f3ede6 100%);display:grid;place-items:center;min-height:100vh}
    .card{background:var(--panel);border-radius:12px;padding:22px;max-width:480px;width:100%;box-shadow:0 10px 26px rgba(12,10,8,0.06)}
    input{padding:12px;border-radius:8px;border:1px solid #e9ddd3;background:#faf7f4;width:100%}
    button{background:var(--accent);color:#fff;border:0;padding:10px 12px;border-radius:8px;font-weight:700}
    p.small{color:var(--muted)}
  </style>
</head>
<body>
  <main class="card">
    <h1>Restablecer contraseña</h1>
    <p class="small">Ingresa tu nueva contraseña.</p>
    <form id="resetForm">
      <input type="password" id="newPassword" placeholder="Nueva contraseña" required>
      <div style="height:10px"></div>
      <button type="submit">Restablecer</button>
    </form>
    <div id="msg" style="margin-top:10px;color:#3d6f19;font-weight:700"></div>
  </main>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const form = document.getElementById('resetForm');
    const msg = document.getElementById('msg');
    if(!token){ document.body.innerHTML = '<p style="padding:20px">Token no proporcionado</p>'; }
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); msg.textContent='';
      const newPassword = document.getElementById('newPassword').value;
      try{
        const res = await fetch('/api/auth/reset', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword})});
        const data = await res.json();
        if(!res.ok){ msg.style.color='#9f2934'; msg.textContent = data.message || 'Error'; return; }
        msg.style.color='green'; msg.textContent = data.message || 'Contraseña restablecida.';
        setTimeout(()=> window.location.href='/login.html',1200);
      }catch(err){ msg.textContent='Error de conexión' }
    });
  </script>
</body>
</html>
